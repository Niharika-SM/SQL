<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration form</title>
</head>
<body>
    <form action="">
        <h1>registration form</h1>
        <label for="username">username: </label>
        <input type="text" id="username"/><br/><br/>

        <label for="number">ph number: </label>
        <input type="num" id="num"/><br/><br/>

        <label for="mail">email: </label>
        <input type="email" id="email"/><br/><br/>

        <label for="dob">date: </label>
        <input type="dob" id="dob"/><br/><br/>

        <label for="file">resume: </label>
        <input type="file" id="file"/><br/><br/>

        <label for="co">courses</label>
        <select name=""id="co">
            <option value=""></option>
            <option value="">python</option>
            <option value="">css</option>
            <option value="">html</option>
        </select><br/><br/>

        <label for=""name=gender>gender:</label>

        <input type="radio" id="male"
        value="male" name="gender"/>
        <label for="male">male</label>
        
        <input type="radio" id="female"
        value="female" name="gender"/>
        <label for="female">female</label>
        
        <input type="radio" id="other"
        value="other" name="gender"/>
         <label for="other">other</label>
         <br/><br/>

         <input type="check box" id="accept"/>
         <label for="accept terms and condition"></label>

         <input type="submit" value="submit"/>
         <input type="reset" value="reset"/>
    </form>
    
</body>
</html>
